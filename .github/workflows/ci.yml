# CI: the build, the tests and the audits, on every push and pull request (SPEC-deploy, "CI").
# The workflow name `ci` and the job ids `test` and `audit` make the check names `ci / test` and
# `ci / audit` that setup step 10 requires. Renaming either, or giving a job a `name:` or a matrix,
# breaks them. `ci / audit-all` shows but is not required.
# Each helper is pinned to the full commit of its release, with the tag in a comment (row 120).
name: ci

on:
  push:
  pull_request:

# A newer run cancels an older one on the same branch or pull request. On main, the release check
# waits for the run of the deployment's own commit, so each main commit gets its own group: a run
# there is never cancelled, and never left pending, which GitHub would cancel when a third arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The token only reads the repository, for the checkout (row 120).
permissions:
  contents: read

jobs:
  test:
    # Pinned: ubuntu-latest moves to 26.04 in November 2026 (research 12).
    runs-on: ubuntu-24.04
    # The release check waits 20 minutes for this job.
    timeout-minutes: 20
    env:
      # The image's Google Chrome prints the PDF in the build and in the tests.
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # pdftotext, pdfinfo and pdffonts for the document checks.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: bun ci
      # No private.yaml in CI, so only the public documents are built.
      - run: bun run build
      - run: bun test

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # bun audit reads bun.lock, so no install comes first. Only production packages decide a release.
      - run: bun audit --prod --audit-level=high

  audit-all:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # Every package, development tools included.
      - run: bun audit --audit-level=high
