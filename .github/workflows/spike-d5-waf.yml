# THROWAWAY (deploy spike, D5). This file lives on the branch prototype/d5-waf only; it never reaches the spike
# branch or main. vercel.json's ignoreCommand "exit 1" overrides the project's Ignored Build Step, so this branch
# builds a protected preview, and its pushes leave the spike's production deployment alone (D4 runs there).
# Check 8 runs in a job of its own, after the wait, as in spike-check. It prints states, hosts and status codes
# only; the bypass secret stays in the environment.
name: spike-d5-waf

on:
  push:
    branches: [prototype/d5-waf]

permissions:
  contents: read
  statuses: read

concurrency:
  group: spike-d5-waf
  cancel-in-progress: true

jobs:
  wait:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    defaults:
      run:
        working-directory: prototypes/deploy-spike
    env:
      # This branch's Git branch URL: <project>-git-<branch>-<team>.vercel.app (protected)
      # https://vercel.com/docs/deployments/generated-urls#generated-from-git
      SPIKE_BRANCH_HOST: resume-deploy-spike-git-prototype-d5-waf-peterkloss.vercel.app
    outputs:
      deployment: ${{ steps.deployment.outputs.deployment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Wait for this commit's preview
        id: deployment
        run: bun check.ts preview-wait
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

  # The same job as spike-check's waf job, after this branch's preview wait.
  waf:
    needs: wait
    if: ${{ !cancelled() && needs.wait.outputs.deployment != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: prototypes/deploy-spike
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Check 8, the WAF rules
        run: bun check.ts waf
        env:
          DEPLOYMENT_HOST: ${{ needs.wait.outputs.deployment }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
