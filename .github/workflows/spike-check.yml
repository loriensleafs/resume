# THROWAWAY (deploy spike, D3 review). This file is the copy on the branch prototype/d3-preview only: it runs
# check 11 against this branch's preview deployment, with and without x-vercel-skip-toolbar. vercel.json's
# ignoreCommand "exit 1" overrides the project's Ignored Build Step, so this branch builds a protected preview.
# It prints verdicts, states and hosts only; the bypass secret stays in the environment.
name: spike-preview

on:
  push:
    branches: [prototype/d3-preview]

permissions:
  contents: read
  statuses: read

concurrency:
  group: spike-preview
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    defaults:
      run:
        working-directory: prototypes/deploy-spike
    env:
      # This branch's Git branch URL: <project>-git-<branch>-<team>.vercel.app (protected)
      # https://vercel.com/docs/deployments/generated-urls#generated-from-git
      SPIKE_BRANCH_HOST: resume-deploy-spike-git-prototype-d3-preview-peterkloss.vercel.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Check 11 on this branch's preview, with and without x-vercel-skip-toolbar
        run: bun check.ts preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
