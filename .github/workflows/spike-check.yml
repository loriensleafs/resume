# PROTOTYPE (deploy spike, tasks D1 to D5). This file lives on prototype/deploy-spike only and never reaches main.
# Each push to the spike branch builds a protected production deployment on the throwaway Vercel project
# (root folder prototypes/deploy-spike). This workflow waits for that commit's deployment and runs check.ts
# against it. It prints verdicts, states and hosts only; the bypass secret stays in the environment.
# The wait and the checks share one 15-minute bound (check.ts RUN_MS); the job timeout adds room for setup.
# A newer push cancels this run. Rerun only the newest run.
name: spike-check

on:
  push:
    branches: [prototype/deploy-spike]

permissions:
  contents: read
  statuses: read

concurrency:
  group: spike-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    defaults:
      run:
        working-directory: prototypes/deploy-spike
    env:
      # The project's Git branch URL: <project>-git-<branch>-<team>.vercel.app (protected)
      # https://vercel.com/docs/deployments/generated-urls#generated-from-git
      SPIKE_BRANCH_HOST: resume-deploy-spike-git-prototype-deploy-spike-peterkloss.vercel.app
      # The project's production address (public under Standard Protection); it never gets the bypass.
      SPIKE_PRODUCTION_HOST: project-8ar0o.vercel.app
    outputs:
      deployment: ${{ steps.deployment.outputs.deployment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Wait for this commit's deployment
        id: deployment
        run: bun check.ts wait
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Run the spike checks
        run: bun check.ts run
        env:
          DEPLOYMENT_HOST: ${{ steps.deployment.outputs.deployment }}
          PRODUCTION_HOST: ${{ steps.deployment.outputs.production }}
          RUN_DEADLINE: ${{ steps.deployment.outputs.deadline }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

  # Check 8 (D5) drives this runner's address to the WAF's chat rate limit on purpose, so it runs in a job of its
  # own, after the other checks, whatever their verdicts: a limited address never hides another check's result.
  waf:
    needs: check
    if: ${{ !cancelled() && needs.check.outputs.deployment != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: prototypes/deploy-spike
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Check 8, the WAF rules
        run: bun check.ts waf
        env:
          DEPLOYMENT_HOST: ${{ needs.check.outputs.deployment }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
