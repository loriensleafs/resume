<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dark: first view</title>
<script src="./support.js"></script>
<script src="acme/design-system.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400..700&amp;family=Google+Sans+Code:wght@400..700&amp;display=swap">
<style>
body{margin:0;background:var(--ds-background-100)}
</style>
</helmet>
<div style="width: 1440px; height: 900px; overflow: hidden; background: var(--ds-background-100); color: var(--ds-gray-1000); font-family: var(--acme-font-sans);">
<dc-import name="MergedStart" appearance="dark" hint-size="1440px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
componentDidMount() {
document.documentElement.setAttribute('data-acme-appearance', 'dark');
}
renderVals() {
return {};
}
}
</script>
</body>
</html>
